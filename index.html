<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Rural Nutrição Animal · Portal de ferramentas</title>
<link rel="icon" href="logo_rural.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rural-ui.css">
<style>
/* ===== Portal (14/10/2026): topo com a fachada, saudação, busca e cartões com identidade própria ===== */
.pt-hero{position:relative;color:#fff;overflow:hidden;min-height:400px;display:flex;flex-direction:column;
  background:#1F3550 url(portal_topo.jpg) 24% 18%/cover no-repeat}
.pt-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,53,80,.10) 0%,rgba(31,53,80,.55) 45%,rgba(31,53,80,.95) 100%)}
.pt-hero>*{position:relative}
.pt-barra{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 4vw}
.pt-logo{background:#fff;border-radius:14px;padding:7px 14px;display:flex;box-shadow:0 6px 18px -8px rgba(0,0,0,.45)}
.pt-logo img{height:40px;width:auto;display:block}
.pt-quem{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pt-btn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:500;cursor:pointer;backdrop-filter:blur(6px)}
.pt-btn:hover{background:rgba(255,255,255,.28)}
.pt-txt{margin-top:auto;padding:24px 5vw 34px}
.pt-rotulo{font-size:.74rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#F8C838}
.pt-txt h1{margin:6px 0 6px;font-size:clamp(2rem,6vw,3rem);font-weight:700;line-height:1.08;letter-spacing:-.02em}
.pt-txt p{margin:0 0 18px;font-size:1.05rem;color:rgba(255,255,255,.88);max-width:34ch}
.pt-busca{position:relative;max-width:460px}
.pt-busca svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:#6B7280;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pt-busca input{width:100%;min-height:50px;border:0;border-radius:16px;padding:0 16px 0 46px;font:inherit;font-size:1rem;color:var(--ru-tinta);background:#fff;box-shadow:0 12px 28px -12px rgba(0,0,0,.5)}
.pt-busca input:focus-visible{outline:3px solid #F8C838;outline-offset:2px}
@media (min-width:900px){
  .pt-hero{min-height:420px;background-position:12% 20%}
  .pt-hero::before{background:linear-gradient(90deg,rgba(31,53,80,0) 0%,rgba(31,53,80,.35) 38%,rgba(31,53,80,.93) 68%)}
  .pt-txt{margin-left:auto;width:min(620px,56%);padding:24px 6vw 48px 0}
}
.pt-main{max-width:1200px;margin:0 auto;padding:30px 4vw 70px}
.pt-grupo{display:flex;align-items:center;gap:12px;margin:30px 0 16px;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ru-azul-esc)}
.pt-grupo::before{content:"";width:26px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ru-azul),var(--ru-verde) 60%,var(--ru-amarelo))}
.pt-grupo::after{content:"";flex:1;height:1px;background:var(--ru-linha)}
.pt-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.cd{position:relative;display:flex;flex-direction:column;gap:12px;padding:24px 22px 18px;background:#fff;border:1px solid var(--ru-linha);border-radius:22px;text-decoration:none;color:inherit;overflow:hidden;isolation:isolate;
  box-shadow:0 1px 2px rgba(31,53,80,.05);transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s,border-color .28s;animation:ptsobe .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
.cd::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.cd::after{content:"";position:absolute;right:-50px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--c2) 0%,transparent 68%);opacity:.12;z-index:-1;transition:opacity .3s,transform .4s}
.cd:hover,.cd:focus-visible{transform:translateY(-6px);border-color:color-mix(in srgb,var(--c1) 40%,#fff);box-shadow:0 22px 40px -18px color-mix(in srgb,var(--c1) 55%,transparent)}
.cd:hover::after{opacity:.24;transform:scale(1.18)}
.cd-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cd-ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 18px -8px var(--c1);transition:transform .35s cubic-bezier(.2,.9,.3,1.4)}
.cd:hover .cd-ico{transform:rotate(-7deg) scale(1.08)}
.cd-ico svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cd-chip{font-size:.66rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--c1);background:color-mix(in srgb,var(--c1) 11%,#fff);padding:5px 11px;border-radius:99px;white-space:nowrap}
.cd h3{margin:6px 0 0;font-size:1.2rem;font-weight:700;color:var(--ru-azul-esc);letter-spacing:-.01em}
.cd p{margin:0;flex:1;color:var(--ru-tinta2);font-size:.92rem;line-height:1.5}
.cd-ir{display:flex;align-items:center;gap:10px;margin-top:4px;font-weight:600;font-size:.9rem;color:var(--c1)}
.cd-ir i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c1) 12%,#fff);transition:transform .28s,background .28s,color .28s}
.cd-ir i svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cd:hover .cd-ir i,.cd:focus-visible .cd-ir i{transform:translateX(6px);background:var(--c1);color:#fff}
.cd:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
@keyframes ptsobe{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cd{animation:none}.cd,.cd-ico,.cd-ir i,.cd::after{transition:none}}
.pt-vazio{margin:40px auto;max-width:520px;text-align:center;padding:28px;border:1px dashed var(--ru-linha);border-radius:18px;background:#fff;color:var(--ru-tinta2)}
.pt-rodape{padding:22px 4vw 34px;text-align:center;color:var(--ru-tinta2);font-size:.8rem;border-top:1px solid var(--ru-linha)}
@media (max-width:640px){.pt-grade{grid-template-columns:1fr}.pt-logo img{height:34px}.pt-hero{min-height:440px}}
</style>
</head>
<body>
<header class="pt-hero">
  <div class="pt-barra">
    <div class="pt-logo"><img src="logo_rural.png" alt="Rural Nutrição Animal 25 anos"></div>
    <div class="pt-quem" id="ptQuem"></div>
  </div>
  <div class="pt-txt">
    <div class="pt-rotulo">Portal de ferramentas · Eldorado &amp; Ivinhema</div>
    <h1 id="ptOla">Olá!</h1>
    <p id="ptSub">Escolha a ferramenta que você precisa.</p>
    <label class="pt-busca"><span style="position:absolute;left:-9999px">Buscar ferramenta</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"/></svg>
      <input id="ptBusca" type="search" placeholder="Buscar ferramenta…" autocomplete="off" disabled>
    </label>
  </div>
</header>
<div class="ru-faixa" aria-hidden="true" style="margin:0;height:5px"><span></span><span></span><span></span></div>

<main class="pt-main" id="ptMain" aria-live="polite"></main>
<footer class="pt-rodape">Rural Nutrição Animal · uso interno</footer>

<script src="rural-auth.js"></script>
<script src="rural-ui.js"></script>
<script>
(function () {
  'use strict';
  // Ícones desenhados em traço (24x24). Só nomes de arquivo e rótulos fixos entram em atributos; todo texto vai como TEXTO.
  var ICONES = {
    calculadora: ['M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z', 'M8 7.5h8', 'M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01'],
    navio: ['M3 16l1.4-5.5h15.2L21 16', 'M12 10.5V5h4', 'M8 10.5V7.5h4', 'M2 19c1.7 1.4 3.3 1.4 5 0s3.3-1.4 5 0 3.3 1.4 5 0 3.3-1.4 5 0'],
    moedas: ['M4 6.5C4 5.1 7.6 4 12 4s8 1.1 8 2.5S16.4 9 12 9 4 7.9 4 6.5z', 'M4 6.5v5C4 12.9 7.6 14 12 14s8-1.1 8-2.5v-5', 'M4 11.5v5C4 17.9 7.6 19 12 19s8-1.1 8-2.5v-5'],
    grafico: ['M3 3v18h18', 'M7 15l4-5 3 3 5-7', 'M19 6h.01'],
    carrinho: ['M3 4h2.2l2.3 11.3a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H6.2', 'M9.5 20h.01M17 20h.01'],
    barras: ['M5 21v-6', 'M10 21V8', 'M15 21v-9', 'M20 21V4'],
    banco: ['M3 10l9-6 9 6', 'M5.5 10v8M10 10v8M14 10v8M18.5 10v8', 'M3 21h18'],
    percentual: ['M19 5L5 19', 'M8 6.5a1.7 1.7 0 1 1-3.4 0 1.7 1.7 0 0 1 3.4 0z', 'M19.4 17.5a1.7 1.7 0 1 1-3.4 0 1.7 1.7 0 0 1 3.4 0z'],
    documento: ['M6 3h8l4 4v14H6z', 'M14 3v4h4', 'M9 12h6M9 16h6'],
    pizza: ['M21 12A9 9 0 1 1 12 3', 'M12 3v9h9'],
    escudo: ['M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', 'M9 12l2 2 4-4'],
    grade: ['M4 4h6v6H4z', 'M14 4h6v6h-6z', 'M4 14h6v6H4z', 'M14 14h6v6h-6z']
  };
  var SETA = ['M5 12h14', 'M13 6l6 6-6 6'];

  // id do app (o mesmo da aba Apps do Rural Auth) -> como o cartão aparece. Ordem = ordem na tela.
  var CATALOGO = [
    { id: 'vendas', grupo: 'Comercial', nome: 'Painel de Vendas', chip: 'Indicadores comerciais', arq: 'vendas.html', ico: 'barras', c: ['#289048', '#5BBF7B'],
      d: 'Vendas por vendedor, cliente e produto, com evolução mensal e indicadores do período.' },
    { id: 'exportacao', grupo: 'Comercial', nome: 'Controle de Exportação', chip: 'Embarques', arq: 'controle_exportacao.html', ico: 'navio', c: ['#2A7F8E', '#52B1C0'],
      d: 'Embarques e processos de exportação, com status, faturas e documentação.' },
    { id: 'ypoti', grupo: 'Comercial', nome: 'Vendas e Baixas (Ypoti)', chip: 'Faturas e baixas', arq: 'controle_ypoti.html', ico: 'moedas', c: ['#B8860B', '#F2C94C'],
      d: 'Vendas e baixas de pagamentos de Ypoti e Chacobras, com emissão de faturas.' },
    { id: 'producao', grupo: 'Operação', nome: 'Custo de Produção', chip: 'Fórmulas e custos', arq: 'producao_rural.html', ico: 'calculadora', c: ['#2060A8', '#5A9BE0'],
      d: 'Ficha de custo, formação de preço, banco de matérias-primas, fórmulas e ordens de produção.' },
    { id: 'compras', grupo: 'Operação', nome: 'Compras e Matéria-Prima', chip: 'Preços de compra', arq: 'compras.html', ico: 'carrinho', c: ['#B4462E', '#E48467'],
      d: 'Consulta de matérias-primas, preços e informações de fornecedores para as compras.' },
    { id: 'fluxo', grupo: 'Finanças', nome: 'Fluxo de Caixa', chip: 'Caixa semanal', arq: 'fluxo_de_caixa.html', ico: 'grafico', c: ['#1F7A3E', '#4FB574'],
      d: 'Fluxo semanal e mensal, recebimentos, antecipações, duplicatas a receber e custo financeiro.' },
    { id: 'financiamentos', grupo: 'Finanças', nome: 'Financiamentos e Empréstimos', chip: 'Dívida bancária', arq: 'financiamentos.html', ico: 'percentual', c: ['#2060A8', '#4C8BD6'],
      d: 'Contratos, desconto de duplicatas e ACC: saldos, parcelas, custo por banco e onde amortizar primeiro.' },
    { id: 'consorcios', grupo: 'Finanças', nome: 'Controle de Consórcios', chip: 'Consórcios', arq: 'consorcios.html', ico: 'banco', c: ['#4B5FBF', '#8497EA'],
      d: 'Consórcios ativos, parcelas pagas e a pagar por empresa e por banco.' },
    { id: 'parcelamentos', grupo: 'Finanças', nome: 'Parcelamentos Fiscais', chip: 'Impostos parcelados', arq: 'parcelamentos.html', ico: 'documento', c: ['#B8860B', '#E9B93B'],
      d: 'Parcelamentos fiscais: saldo devedor de cada um e andamento das parcelas.' },
    { id: 'dre', grupo: 'Finanças', nome: 'DRE', chip: 'Resultado', arq: 'dre.html', ico: 'pizza', c: ['#1F3550', '#4A6C96'],
      d: 'Resultado da Rural e da RNA desde 2018: margens, projeção do ano, lucro para caixa e capital de giro.' }
  ];
  var ORDEM_GRUPOS = ['Comercial', 'Operação', 'Finanças', 'Outras', 'Administração'];
  var ARQUIVO_OK = /^[A-Za-z0-9_\-]+\.html$/;

  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, txt) { var n = document.createElement(tag); if (cls) n.className = cls; if (txt !== undefined) n.textContent = txt; return n; };
  var NS = 'http://www.w3.org/2000/svg';
  function svg(nome) {
    var s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
    (typeof nome === 'string' ? ICONES[nome] || ICONES.grade : nome).forEach(function (d) { var p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); s.appendChild(p); });
    return s;
  }
  function semAcento(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  function saudacao() {
    var h = new Date().getHours();
    return h < 12 ? 'Bom dia' : (h < 18 ? 'Boa tarde' : 'Boa noite');
  }
  function primeiroNome(u) {
    var n = String((u && (u.nome || u.usuario)) || '').trim().split(/\s+/)[0] || '';
    return n.charAt(0).toUpperCase() + n.slice(1);
  }

  // Monta a lista de cartões a partir do que o servidor liberou para esta pessoa (nunca mostra o que ela não pode abrir).
  function cartoes(ctx) {
    var liberados = (ctx.apps || []).filter(function (a) { return a && typeof a.id === 'string'; });
    var lista = [];
    CATALOGO.forEach(function (c) {
      var app = liberados.filter(function (a) { return a.id === c.id; })[0];
      if (app) lista.push({ grupo: c.grupo, nome: c.nome, chip: c.chip, d: c.d, ico: c.ico, c: c.c, href: ARQUIVO_OK.test(String(app.url || '')) ? app.url : c.arq });
    });
    liberados.forEach(function (a) {   // app novo que ainda nao esta no catalogo: aparece com cartao simples
      if (CATALOGO.some(function (c) { return c.id === a.id; })) return;
      var arq = ARQUIVO_OK.test(String(a.url || '')) ? a.url : (window.RuralUI && RuralUI.ARQUIVOS[a.id]) || '';
      if (ARQUIVO_OK.test(arq)) lista.push({ grupo: 'Outras', nome: String(a.nome || a.id), chip: 'Ferramenta', d: 'Abrir ' + String(a.nome || a.id) + '.', ico: 'grade', c: ['#2060A8', '#5A9BE0'], href: arq });
    });
    var u = ctx.usuario || {};
    if (u.admin || u.adm) lista.push({ grupo: 'Administração', nome: 'Acessos', chip: 'Administração', d: 'Usuários, senhas, ferramentas liberadas e permissões de cada pessoa.', ico: 'escudo', c: ['#1F3550', '#4A6C96'], href: 'admin.html' });
    return lista;
  }

  function cartao(c, i) {
    var a = el('a', 'cd'); a.href = c.href; a.style.setProperty('--c1', c.c[0]); a.style.setProperty('--c2', c.c[1]); a.style.setProperty('--i', String(i));
    var topo = el('div', 'cd-topo'), ico = el('span', 'cd-ico'); ico.appendChild(svg(c.ico));
    topo.appendChild(ico); topo.appendChild(el('span', 'cd-chip', c.chip)); a.appendChild(topo);
    a.appendChild(el('h3', '', c.nome)); a.appendChild(el('p', '', c.d));
    var ir = el('span', 'cd-ir', 'Abrir'), seta = el('i'); seta.appendChild(svg(SETA)); ir.appendChild(seta); a.appendChild(ir);
    a.setAttribute('data-busca', semAcento(c.nome + ' ' + c.d + ' ' + c.chip + ' ' + c.grupo));
    return a;
  }

  function desenhar(lista) {
    var main = $('ptMain'); main.textContent = '';
    if (!lista.length) {
      var v = el('div', 'pt-vazio'); v.appendChild(el('strong', '', 'Nenhuma ferramenta liberada para você ainda.'));
      v.appendChild(el('p', '', 'Peça a liberação ao administrador e depois atualize esta página.')); main.appendChild(v); return;
    }
    var i = 0;
    ORDEM_GRUPOS.forEach(function (g) {
      var doGrupo = lista.filter(function (c) { return c.grupo === g; });
      if (!doGrupo.length) return;
      var sec = el('section'); sec.setAttribute('data-grupo', g);
      sec.appendChild(el('h2', 'pt-grupo', g));
      var grade = el('div', 'pt-grade');
      doGrupo.forEach(function (c) { grade.appendChild(cartao(c, i++)); });
      sec.appendChild(grade); main.appendChild(sec);
    });
    var nada = el('div', 'pt-vazio', 'Nenhuma ferramenta encontrada para essa busca.'); nada.id = 'ptNada'; nada.style.display = 'none'; main.appendChild(nada);
  }

  function filtrar() {
    var q = semAcento($('ptBusca').value).trim(), vistos = 0;
    document.querySelectorAll('#ptMain .cd').forEach(function (a) {
      var ok = !q || a.getAttribute('data-busca').indexOf(q) >= 0; a.style.display = ok ? '' : 'none'; if (ok) vistos++;
    });
    document.querySelectorAll('#ptMain section').forEach(function (s) {
      s.style.display = Array.prototype.some.call(s.querySelectorAll('.cd'), function (a) { return a.style.display !== 'none'; }) ? '' : 'none';
    });
    var n = $('ptNada'); if (n) n.style.display = vistos ? 'none' : '';
  }

  function entrar(ctx) {
    RuralAuth.marcarPortal();   // a partir daqui, abrir um app nesta aba nao volta ao portal
    var lista = cartoes(ctx), nome = primeiroNome(ctx.usuario);
    $('ptOla').textContent = saudacao() + (nome ? ', ' + nome : '') + '!';
    var n = lista.filter(function (c) { return c.grupo !== 'Administração'; }).length;
    $('ptSub').textContent = n ? 'Escolha a ferramenta que você precisa agora.' : 'Seu acesso ainda não tem ferramentas liberadas.';
    var quem = $('ptQuem'); quem.textContent = '';
    var troca = el('button', 'pt-btn', 'Trocar senha'); troca.type = 'button'; troca.addEventListener('click', function () { RuralAuth.trocarSenha(); });
    var sair = el('button', 'pt-btn', 'Sair'); sair.type = 'button'; sair.addEventListener('click', function () { RuralAuth.sair(); });
    quem.appendChild(troca); quem.appendChild(sair);
    desenhar(lista);
    var b = $('ptBusca'); b.disabled = !lista.length; b.value = ''; b.oninput = filtrar;
  }

  RuralAuth.iniciar({ aoEntrar: entrar });   // sem "app": o portal mostra o que a pessoa pode abrir
})();
</script>
</body>
</html>
