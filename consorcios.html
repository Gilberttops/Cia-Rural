<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Consórcios · Rural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rural-ui.css">
<link rel="icon" href="logo_rural.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
</head>
<body>
<div id="app"></div>
<script src="rural-auth.js"></script>
<script src="rural-ui.js"></script>
<script src="consorcios-app.js"></script>
<script>
  // Script de dados do Consórcios (planilha Controle_Consorcios_Rural). Sem login ele não entrega nada.
  var CONSORCIOS_URL = 'https://script.google.com/macros/s/AKfycbyJPDoibi3NzmQMSE5PUloxOuF6mfnmnA3DR3fA5aAQTYkavxPvpgjvrjjZMY2shz_-/exec';
  RuralAuth.iniciar({
    app: 'consorcios',
    aoEntrar: function (ctx) {
      ConsorciosApp.montar(document.getElementById('app'), {
        url: CONSORCIOS_URL, logo: 'logo_rural.png', usuario: ctx.usuario, apps: ctx.apps, aoSair: function () { RuralAuth.sair(); }
      });
    }
  });
</script>
</body>
</html>
